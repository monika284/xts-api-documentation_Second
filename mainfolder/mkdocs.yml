site_name: RMoney API Documentation

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.png
  features:
    - navigation.top
    - navigation.indexes
    - navigation.path
    - navigation.expand
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link

  palette:
    - scheme: default
      primary: white
      accent: deep orange

nav:
  - Home: index.md

  - Getting Started:
      - Introducton: GS/intro.md

  - Interactive API:
      - Overview: interactive/overview.md
      - User: interactive/user/user.md
      - Authentication: interactive/Authentication.md
      - Base URL & Endpoints: interactive/baseurl.md
      - Data Types & Business Rules: interactive/DataTypes&BussinessRules.md
      - Rate Limit: interactive/RateLimit.md

      - Enums With Numeric Constants: interactive/EnumsWithNumericConstants.md
      - Standard Orders:
